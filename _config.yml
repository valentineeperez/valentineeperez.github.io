# ─── Site identity ────────────────────────────────────────────────
title: "Valentine Perez"
name:  "Valentine Perez"
description: "PhD student in neuroimaging at Université Paris-Saclay, CEA, CNRS, NeuroSpin"
url: "https://valentineeperez.github.io"
baseurl: ""          # leave empty if the repo IS your github.io site

# ─── Theme (Minimal Mistakes – works natively on GitHub Pages) ────
remote_theme: "mmistakes/minimal-mistakes@4.26.2"
minimal_mistakes_skin: "air"   # air | aqua | contrast | dark | dirt | neon | mint | sunrise

# ─── Author (populates sidebar automatically) ─────────────────────
author:
  name: "Valentine Perez"
  avatar: "/assets/images/avatar.jpg"    # add a photo at this path
  bio: "PhD student in neuroimaging at NeuroSpin. I work on BOLD fMRI for small vessel disease."
  location: "Gif-sur-Yvette, France"
  email: "valentine.perez@cea.fr"
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:valentine.perez@cea.fr"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/valentineeperez"
    - label: "Google Scholar"
      icon: "fas fa-fw fa-graduation-cap"
      url: "https://https://scholar.google.com/citations?user=1Ma34pAAAAAJ&hl=fr"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/valentine-perez-b60736163/"
    # - label: "ORCID"
    #   icon: "fab fa-fw fa-orcid"
    #   url: "https://orcid.org/<your-orcid>"
    # - label: "ResearchGate"
    #   icon: "fab fa-fw fa-researchgate"
    #   url: "https://www.researchgate.net/profile/<your-profile>"

# ─── Navigation bar ───────────────────────────────────────────────
# Create the matching .md files in the root of your repo (see below)
navigation:
  - title: "About"
    url: /
  - title: "CV"
    url: /cv/
  - title: "Research"
    url: /research/
  - title: "Publications"
    url: /publications/
  - title: "Abstracts"
    url: /abstracts/
  - title: "Projects"
    url: /projects/
  - title: "Teaching"
    url: /teaching/
  - title: "Talks & Conferences"
    url: /talks/
  - title: "Blog"
    url: /blog/

# ─── Defaults (sidebar shown on every page) ───────────────────────
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true   # shows your sidebar on every page
      read_time: false
      share: false
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      share: true

# ─── Plugins (required by GitHub Pages + Minimal Mistakes) ────────
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-remote-theme

# ─── Build settings ───────────────────────────────────────────────
markdown: kramdown
highlighter: rouge
permalink: /:categories/:title/
paginate: 5
paginate_path: /blog/page:num/
timezone: Europe/Paris

# ─── SEO & analytics (optional) ───────────────────────────────────
# google_analytics: "G-XXXXXXXXXX"
# google_site_verification: ""

# ─── Footer ───────────────────────────────────────────────────────
footer:
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:valentine.perez@cea.fr"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/valentineeperez"
    - label: "Google Scholar"
      icon: "fas fa-fw fa-graduation-cap"
      url: "https://https://scholar.google.com/citations?user=1Ma34pAAAAAJ&hl=fr"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/valentine-perez-b60736163/"
